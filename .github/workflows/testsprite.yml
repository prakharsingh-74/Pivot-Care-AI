name: TestSprite CI Verification

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]

jobs:
  testsprite-verify:
    name: Run TestSprite E2E Checks
    runs-on: ubuntu-latest
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      PROJECT_ID: "1e331429-8d70-4e6b-9ad9-12918a33594e"
      TARGET_URL: "https://pivot-care-ai-web.vercel.app/"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      - name: Run TestSprite Verification Suite
        run: |
          testsprite test run 490bb17a-880b-471c-9c11-2c04c71ef4ad --target-url "$TARGET_URL" --wait --timeout 600
